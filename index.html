<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ルーレットで旅先決め 子供の遊び場めぐり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#1f3a68; --sea-deep:#152b52; --wave:rgba(255,255,255,.06);
  --land:#f4f1e8; --land-edge:#b9c3d6; --land-off:#3b5687; --edge-off:#2a4573;
  --gold:#ffc93c; --gold-deep:#c8920a; --flight:#e8412c; --ink:#14223d; --text:#ffffff; --muted:#b8c6e3;
  --kyushu:#e8412c; --chugoku:#2fa37a; --shikoku:#4f8fe8;
  --panel:#ffffff; --panel-text:#14223d; --panel-muted:#5a6886;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sea:#172d55; --sea-deep:#0f2042; --panel:#1d2d4f; --panel-text:#f2f4fa; --panel-muted:#a9b6d3; --land-off:#30497a; --edge-off:#223b67; }
}
:root[data-theme="dark"]{ --sea:#172d55; --sea-deep:#0f2042; --panel:#1d2d4f; --panel-text:#f2f4fa; --panel-muted:#a9b6d3; --land-off:#30497a; --edge-off:#223b67; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--sea-deep);color:var(--text);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
  font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-family:"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif;font-weight:400;
  font-size:clamp(28px,8vw,40px);line-height:1.15;margin:8px 0 4px;letter-spacing:.02em}
h1 small{display:block;font-family:inherit;font-size:.42em;color:var(--gold);letter-spacing:.08em;margin-bottom:6px}
.lead{margin:0 0 16px;color:var(--muted);font-size:14px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 14px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--gold)}
.spots{margin:18px 0 0;padding:16px 0 0;border-top:1px solid color-mix(in srgb,var(--panel-muted) 35%,transparent)}
.spots h3{font-size:16px;margin:0 0 10px}
.spot{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:10px 0;align-items:start}
.spot .no{grid-row:span 3;width:28px;height:28px;border-radius:50%;background:#14223d;color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.spot .nm{font-weight:700;font-size:16px;line-height:1.35}
.spot .nm a{color:inherit;text-decoration-color:var(--panel-muted);text-underline-offset:3px}
.spot .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.tag{border-radius:6px;padding:1px 7px;background:color-mix(in srgb,var(--panel-muted) 18%,transparent)}
.tag.age{background:color-mix(in srgb,var(--gold) 35%,transparent)}
.spot .desc{font-size:14px;color:var(--panel-muted)}
.note{font-size:12px;color:var(--panel-muted);margin:8px 0 0}
.spotmark text{font:700 15px "Zen Kaku Gothic New",sans-serif;fill:#fff}
.result .pref-big{font-family:"Dela Gothic One",sans-serif;font-size:clamp(36px,11vw,52px);line-height:1.1;margin:0 0 4px}
.result .area{font-size:14px;color:var(--panel-muted);margin:0}
.tag.hot{background:var(--flight);color:#fff}
.hotel .no{background:var(--chugoku)}
.hotel .no,.spot .no{font-size:13px}
.board[hidden]{display:none}
.setup{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px;margin:0 0 20px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:0;border-radius:10px;padding:9px 10px;width:100%}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;border-radius:12px;overflow:hidden;border:1.5px solid var(--gold)}
.seg button{font:inherit;font-size:15px;font-weight:700;padding:9px;border:0;background:transparent;color:var(--text);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.seg button:focus-visible,.field input:focus-visible,.field select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.origin-msg{font-size:12px;color:var(--muted);margin:8px 0 0;min-height:1em}
.spot>*:not(.no){grid-column:2}
.spot .no{grid-row:1/span 4;grid-column:1}
.price{font-size:13px;color:var(--panel-text);font-weight:700}
.cost{margin:18px 0 0;padding:16px;border-radius:14px;background:color-mix(in srgb,var(--gold) 16%,transparent)}
.cost h3{font-size:16px;margin:0 0 4px}
.cost .total{font-family:"Dela Gothic One",sans-serif;font-size:clamp(28px,9vw,40px);line-height:1.2;margin:2px 0 10px}
.cost table{width:100%;border-collapse:collapse;font-size:14px}
.cost td{padding:7px 0;border-top:1px solid color-mix(in srgb,var(--panel-muted) 30%,transparent);vertical-align:top}
.cost td:last-child{text-align:right;white-space:nowrap;font-weight:700;padding-left:10px}
.cost .sub{display:block;font-size:12px;color:var(--panel-muted);font-weight:400}
.pick{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:4px 0;cursor:pointer}
.pick input{width:18px;height:18px;margin-top:2px;accent-color:var(--ink);flex:none}
.cost h4{font-size:14px;margin:12px 0 2px}
footer{margin-top:28px;font-size:12px;color:var(--muted)}
footer a{color:inherit}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin:0 0 8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}

.wheel-wrap{position:relative;width:min(100%,420px);margin:0 auto}
.wheel{transition:transform 4.6s cubic-bezier(.1,.7,.12,1);will-change:transform}
.wheel svg{display:block;width:100%;height:auto}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:34px;height:44px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3));z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:24%;aspect-ratio:1;border-radius:50%;background:var(--sea-deep);
  border:4px solid var(--gold);display:grid;place-items:center;font-family:"Dela Gothic One",sans-serif;font-size:clamp(13px,3.6vw,17px);color:var(--gold);text-align:center;line-height:1.2}
.slice-label{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:17px;fill:var(--ink)}
.band-label{font-family:"Dela Gothic One",sans-serif;font-size:15px;fill:#fff;letter-spacing:.2em}

.spin{display:block;width:100%;margin:22px 0 0;border:0;border-radius:16px;cursor:pointer;
  background:var(--gold);color:var(--ink);font-family:"Dela Gothic One",sans-serif;font-size:22px;padding:16px;
  box-shadow:0 5px 0 var(--gold-deep);transition:transform .08s,box-shadow .08s}
.spin:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-deep)}
.spin:disabled{opacity:.6;cursor:default}
.spin:focus-visible,.ghost:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.status{text-align:center;color:var(--muted);font-size:14px;margin:10px 0 0;min-height:1.6em}

.board{position:relative;border-radius:22px;overflow:hidden;background:var(--sea);margin-top:22px;
  background-image:repeating-radial-gradient(circle at 50% 120%,transparent 0 14px,var(--wave) 14px 15px)}
.board::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 6px var(--sea-deep),inset 0 0 0 8px rgba(255,201,60,.55)}
.board svg{display:block;width:100%;height:auto}
.pref{fill:var(--land-off);stroke:var(--edge-off);stroke-width:.6;transition:fill .4s}
.pref.on{fill:var(--land);stroke:var(--land-edge)}
.pref.pick{fill:var(--gold);stroke:var(--gold-deep)}
.dot{fill:var(--ink);opacity:.35}
.dot.cur{fill:var(--flight);opacity:1}
.ticker{position:absolute;left:0;right:0;bottom:18px;text-align:center;pointer-events:none;
  font-family:"Dela Gothic One",sans-serif;font-size:clamp(24px,7vw,34px);color:#fff;text-shadow:0 2px 0 var(--sea-deep),0 0 12px var(--sea-deep)}

.result{background:var(--panel);color:var(--panel-text);border-radius:20px;padding:20px;margin-top:18px;display:none}
.result.show{display:block;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.result .pref-name{font-size:15px;color:var(--panel-muted);margin:0}
.result .city{font-family:"Dela Gothic One",sans-serif;font-size:clamp(36px,11vw,52px);line-height:1.1;margin:2px 0;word-break:keep-all;overflow-wrap:anywhere}
.result .kana{font-size:14px;color:var(--panel-muted);margin:0 0 12px}
.result .phrase{margin:0 0 16px;padding-left:12px;border-left:4px solid var(--flight);font-size:15px}
.links{display:flex;gap:10px;flex-wrap:wrap}
.ghost{flex:1 1 140px;text-align:center;text-decoration:none;color:var(--panel-text);border:1.5px solid var(--panel-muted);
  border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.history{margin-top:28px}
.history h2{font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.history h2 button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
.history ol{list-style:none;margin:0;padding:0}
.history li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:15px}
.history li span:last-child{color:var(--muted);font-size:12px;white-space:nowrap}
.empty{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){.result.show{animation:none}.wheel{transition-duration:.8s}}
</style>
</head>

<div class="wrap">
  <h1><small>九州・沖縄・中国・四国 17県から</small>ルーレットで旅先決め</h1>
  <p class="lead">ルーレットで県を決めると、子供が遊べるおすすめスポット5選と近くのホテル、旅の費用の目安を出します。</p>
  <div class="legend"><span style="--c:var(--kyushu)">九州・沖縄</span><span style="--c:var(--chugoku)">中国</span><span style="--c:var(--shikoku)">四国</span></div>

  <section class="setup" aria-label="出発地と人数">
    <label class="field wide">出発地（市区町村）
      <input id="origin" list="originList" autocomplete="off" placeholder="例：広島県 広島市">
    </label>
    <datalist id="originList"></datalist>
    <div class="row">
      <label class="field">大人<select id="nA"></select></label>
      <label class="field">小学生<select id="nC"></select></label>
      <label class="field">未就学児<select id="nI"></select></label>
      <label class="field">泊数<select id="nN"></select></label>
    </div>
    <div class="seg" role="radiogroup" aria-label="交通手段">
      <button type="button" data-mode="car" aria-pressed="true">車</button>
      <button type="button" data-mode="pt" aria-pressed="false">公共交通機関</button>
    </div>
    <p class="origin-msg" id="originMsg"></p>
  </section>

  <div class="wheel-wrap">
    <svg class="pointer" viewBox="0 0 34 44" aria-hidden="true"><path d="M17 44 L2 10 A15 15 0 1 1 32 10 Z" fill="#ffc93c" stroke="#14223d" stroke-width="2.5"/><circle cx="17" cy="14" r="5" fill="#14223d"/></svg>
    <div class="wheel" id="wheel"><svg id="wheelSvg" viewBox="-210 -210 420 420" role="img" aria-label="17県のルーレット"></svg></div>
    <div class="hub" id="hub">回す</div>
  </div>

  <button class="spin" id="spin">ルーレットを回す</button>
  <p class="status" id="status" aria-live="polite"></p>

  <div class="board" id="board" hidden>
    <svg id="map" viewBox="0 0 600 520" role="img" aria-label="選ばれた県の地図">
      <g id="prefs"></g><g id="dots"></g>
    </svg>
  </div>

  <section class="result" id="result" aria-live="polite"></section>

  <section class="history">
    <h2><span>これまでの旅先 <span id="count" style="color:var(--muted);font-weight:400;font-size:13px"></span></span><button id="clear" type="button">記録を消す</button></h2>
    <ol id="hist"></ol>
  </section>
  <footer>スポット選定の参考：<a href="https://iko-yo.net/" target="_blank" rel="noopener">いこーよ</a>の家族でおでかけ人気ランキング・口コミほか（2026年10月時点）。位置：© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors　営業日・料金はお出かけ前に各施設の公式情報で確認してください。</footer>
</div>

const AREAS=[
  {name:"九州・沖縄", color:"var(--kyushu)", ids:[40,41,42,43,44,45,46,47]},
  {name:"中国", color:"var(--chugoku)", ids:[31,32,33,34,35]},
  {name:"四国", color:"var(--shikoku)", ids:[36,37,38,39]},
];
const WHEEL_IDS=AREAS.flatMap(a=>a.ids);
const prefById=Object.fromEntries(DATA.prefs.map(p=>[p.id,p]));
const areaOf=id=>AREAS.find(a=>a.ids.includes(id));
const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---- ルーレット盤 ----
const N=WHEEL_IDS.length, SL=360/N, R=200, RB=184, RL=128;
function pt(r,deg){const a=(deg-90)*Math.PI/180;return [r*Math.cos(a),r*Math.sin(a)];}
function arc(r0,r1,a0,a1){const [x0,y0]=pt(r1,a0),[x1,y1]=pt(r1,a1),[x2,y2]=pt(r0,a1),[x3,y3]=pt(r0,a0);const l=a1-a0>180?1:0;
  return `M${x0},${y0}A${r1},${r1} 0 ${l} 1 ${x1},${y1}L${x2},${y2}A${r0},${r0} 0 ${l} 0 ${x3},${y3}Z`;}
(function drawWheel(){
  let h="";
  WHEEL_IDS.forEach((id,i)=>{
    const a0=i*SL,a1=a0+SL,mid=a0+SL/2;
    h+=`<path d="${arc(0,RB,a0,a1)}" fill="${i%2?"#ffc93c":"#f4f1e8"}" stroke="#14223d" stroke-width="1.5"/>`;
    h+=`<path d="${arc(RB,R,a0,a1)}" fill="${areaOf(id).color}" stroke="#14223d" stroke-width="1.5"/>`;
    h+=`<text class="slice-label" transform="rotate(${mid}) translate(0,${-RL}) rotate(90)" text-anchor="middle" dominant-baseline="central">${esc(prefById[id].name)}</text>`;
  });
  h+=`<circle r="${R}" fill="none" stroke="#14223d" stroke-width="4"/>`;
  $("wheelSvg").innerHTML=h;
})();

// ---- 地図 ----
const features=DATA.prefs.map(p=>({type:"Feature",id:p.id,geometry:{type:"MultiPolygon",coordinates:p.c}}));
const projection=d3.geoMercator(), path=d3.geoPath(projection);
const W=600,H=520,PAD=34;
const gPrefs=d3.select("#prefs"), gDots=d3.select("#dots");
function km(a,b,c,d){const k=Math.cos((a+c)/2*Math.PI/180);return 111.2*Math.hypot((b-d)*k,a-c);}
function boxOf(pts,m){const lo=pts.map(p=>p[0]),la=pts.map(p=>p[1]);
  const x0=Math.min(...lo)-m,x1=Math.max(...lo)+m,y0=Math.min(...la)-m,y1=Math.max(...la)+m;
  return {type:"Feature",geometry:{type:"Polygon",coordinates:[[[x0,y0],[x0,y1],[x1,y1],[x1,y0],[x0,y0]]]}};}
function drawPref(pid,spots,hotels){
  const pts=[...spots.map(s=>[s[6],s[5]]),...hotels.map(h=>[h.h[4],h.h[3]])];
  projection.fitExtent([[PAD,PAD],[W-PAD,H-PAD]],boxOf(pts,.18));
  gPrefs.selectAll("path").data(features,d=>d.id).join("path")
    .attr("class",d=>"pref"+(WHEEL_IDS.includes(d.id)?" on":"")+(d.id===pid?" pick":"")).attr("d",path);
  gDots.selectAll("*").remove();
  hotels.forEach((x,i)=>{const [hx,hy]=projection([x.h[4],x.h[3]]);
    const g=gDots.append("g").attr("class","spotmark").attr("transform",`translate(${hx},${hy})`);
    g.append("rect").attr("x",-13).attr("y",-13).attr("width",26).attr("height",26).attr("rx",6).attr("fill","#2fa37a").attr("stroke","#fff").attr("stroke-width",2.5);
    g.append("text").attr("text-anchor","middle").attr("dy","0.36em").text("H");});
  spots.forEach((s,i)=>{const [sx,sy]=projection([s[6],s[5]]);
    const g=gDots.append("g").attr("class","spotmark").attr("transform",`translate(${sx},${sy})`).style("opacity",0);
    g.append("circle").attr("r",14).attr("fill","#14223d").attr("stroke","#fff").attr("stroke-width",2.5);
    g.append("text").attr("text-anchor","middle").attr("dy","0.36em").text(i+1);
    g.transition().delay(reduceMotion?0:i*160).duration(reduceMotion?0:250).style("opacity",1);});
}

// ---- 進行 ----
let rotation=0, busy=false;
const spinBtn=$("spin"), status=$("status"), resultEl=$("result"), board=$("board");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function hotelsFor(pid,spots){
  return DATA.hotels.filter(h=>h[0]===pid).map(h=>{
    let best=null;spots.forEach(s=>{const d=km(h[3],h[4],s[5],s[6]);if(!best||d<best.d)best={s,d};});
    return {h,near:best};
  }).sort((a,b)=>a.near.d-b.near.d).slice(0,3);
}

async function run(){
  if(busy) return; busy=true; spinBtn.disabled=true;
  resultEl.className="result"; board.hidden=true;
  status.textContent="ルーレットが回っています…";
  const idx=Math.floor(Math.random()*N), pid=WHEEL_IDS[idx];
  const jitter=(Math.random()-.5)*SL*0.7;
  const target=-(idx*SL+SL/2+jitter);
  const base=rotation-((rotation%360)+360)%360;
  rotation=base-360*(reduceMotion?1:6)+((target%360)+360)%360-360;
  $("wheel").style.transform=`rotate(${rotation}deg)`;
  await wait(reduceMotion?850:4700);
  const pref=prefById[pid];
  $("hub").textContent=pref.name;
  status.textContent=`${pref.name}に決定！`;
  const spots=DATA.spots.filter(s=>s[0]===pid);
  const hotels=hotelsFor(pid,spots);
  board.hidden=false;
  drawPref(pid,spots,hotels);
  showResult(pref,spots,hotels);
  board.scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"});
  saveHistory(pref.name,spots[0][1]);
  spinBtn.textContent="もう一回まわす"; spinBtn.disabled=false; busy=false;
}

function gmap(q){return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;}
function showResult(pref,spots,hotels){
  resultEl.className="result show";
  resultEl.innerHTML=`<p class="area">${esc(areaOf(pref.id).name)}</p><p class="pref-big">${esc(pref.name)}</p>
    <div class="spots"><h3>子供の遊び場 おすすめ5選</h3>
    ${spots.map((s,i)=>`<div class="spot"><span class="no">${i+1}</span>
      <span class="nm"><a href="${gmap(s[1])}" target="_blank" rel="noopener">${esc(s[1])}</a></span>
      <span class="meta"><span class="tag">${esc(s[2])}</span><span class="tag age">${esc(s[3])}</span>${s[7]===1?'<span class="tag hot">口コミで人気</span>':s[7]===2?'<span class="tag hot">新スポット</span>':''}</span>
      <span class="desc">${esc(s[4])}</span>
      <span class="price">${feeText(s)}</span></div>`).join("")}
    </div>
    <div class="spots"><h3>近くで家族で泊まれるホテル</h3>
    ${hotels.map((x,i)=>`<div class="spot hotel"><span class="no">H</span>
      <span class="nm"><a href="${gmap(x.h[1])}" target="_blank" rel="noopener">${esc(x.h[1])}</a></span>
      <span class="meta"><span class="tag">${esc(x.near.s[1])}まで約${Math.max(1,Math.round(x.near.d))}km</span></span>
      <span class="desc">${esc(x.h[2])}</span>
      <span class="price">1泊 大人1人 約${yen(x.h[5])}〜（目安）</span></div>`).join("")}
    </div>
    <div class="cost" id="cost"></div>
    <p class="note">費用はすべて概算です。料金は2026年10月時点で調べた目安、交通費は距離から計算した目安で、時期や経路で大きく変わります。お出かけ前に公式情報で確認してください。</p>`;
  cur={pref,spots,hotels,checked:new Set([0,1]),hotel:0};
  renderCost();
}

// ---- 費用 ----
let cur=null, mode="car";
const yen=n=>(Math.round(n/100)*100).toLocaleString("ja-JP")+"円";
const fee=n=>n.toLocaleString("ja-JP")+"円";
function feeText(s){
  if(!s[8]&&!s[9]) return "入場無料（一部有料の遊具・体験あり）";
  return `大人${s[8]?fee(s[8]):"無料"}・小学生${s[9]?fee(s[9]):"無料"}${s[10]?"（目安・要確認）":""}`;
}
const islandOf=p=>p===47?"okinawa":p===1?"hokkaido":(p>=36&&p<=39)?"shikoku":(p>=40&&p<=46)?"kyushu":"honshu";
function family(){return {a:+$("nA").value,c:+$("nC").value,i:+$("nI").value,n:+$("nN").value};}
function findOrigin(){
  const v=$("origin").value.trim().replace(/\s+/g," ");
  if(!v) return null;
  let o=DATA.origins.find(x=>`${x[1]} ${x[2]}`===v);
  if(!o){const c=v.replace(/\s/g,"");o=DATA.origins.find(x=>(x[1]+x[2])===c)||DATA.origins.find(x=>x[2]===c)||DATA.origins.find(x=>(x[1]+x[2]).includes(c));}
  return o||false;
}
function transport(o,dest,pid,f){
  const d=km(o[3],o[4],dest[0],dest[1]);
  const oi=islandOf(o[0]), di=islandOf(pid);
  const sea=(oi!==di)&&(oi==="okinawa"||di==="okinawa"||oi==="hokkaido"||di==="hokkaido");
  const lines=[]; let total=0, note="";
  let m=mode;
  if(m==="car"&&sea){m="pt";note="車では行けないため飛行機で計算しています。";}
  if(m==="car"){
    const road=d*1.25;
    const fuel=road*2/12*170;
    let toll=road>40?road*2*0.85*24.6:0;
    if((oi==="shikoku")!==(di==="shikoku")) toll+=2*2500;
    total=fuel+toll;
    lines.push(["ガソリン代（往復）",fuel,`片道 約${Math.round(road)}km・燃費12km/L・170円/Lで計算`]);
    if(toll) lines.push(["高速道路代（往復）",toll,"普通車・ETC割引なしの目安"]);
  }else{
    const air=sea||d>700;
    let fareA,fareC,label,sub;
    if(air){fareA=10000+d*10+1000;fareC=(10000+d*10)*0.75;label="飛行機（往復）";sub="空港までの移動を含む目安。早割ならもっと安くなります";}
    else{const rk=d*1.2;fareA=rk<80?Math.max(200,rk*20):1000+rk*25;fareC=fareA/2;label=rk<80?"電車・バス（往復）":"新幹線・特急など（往復）";sub=`鉄道 片道 約${Math.round(rk)}kmで計算`;}
    const ride=(fareA*f.a+fareC*f.c)*2; total+=ride; lines.push([label,ride,sub]);
    const days=f.n+1;
    if(di==="okinawa"&&oi!=="okinawa"){const rc=7000*days;total+=rc;lines.push(["現地のレンタカー",rc,`${days}日分・ガソリン代込みの目安`]);}
    else{const loc=(1000*f.a+500*f.c)*days;total+=loc;lines.push(["現地のバス・タクシーなど",loc,`${days}日分の目安`]);}
  }
  return {total,lines,note,d};
}
function renderCost(){
  if(!cur) return;
  const f=family(), {spots,hotels}=cur, el=$("cost");
  const o=findOrigin();
  const dest=[spots.reduce((s,x)=>s+x[5],0)/spots.length, spots.reduce((s,x)=>s+x[6],0)/spots.length];
  let entry=0; cur.checked.forEach(i=>{const s=spots[i];entry+=s[8]*f.a+s[9]*f.c;});
  const h=hotels[cur.hotel]; const stay=h?h.h[5]*(f.a+f.c*0.7)*f.n:0;
  const tr=o?transport(o,dest,cur.pref.id,f):null;
  const total=entry+stay+(tr?tr.total:0);
  let rows=`<tr><td>施設の入場料<span class="sub">チェックした${cur.checked.size}か所・未就学児は無料で計算</span></td><td>${yen(entry)}</td></tr>`;
  rows+=`<tr><td>宿泊費<span class="sub">${h?esc(h.h[1]):""}・${f.n}泊・小学生は大人の7割、未就学児は添い寝無料で計算</span></td><td>${yen(stay)}</td></tr>`;
  if(tr) tr.lines.forEach(l=>rows+=`<tr><td>${l[0]}<span class="sub">${l[2]}</span></td><td>${yen(l[1])}</td></tr>`);
  el.innerHTML=`<h3>費用の目安（大人${f.a}人・小学生${f.c}人・未就学児${f.i}人、${f.n}泊）</h3>
    <p class="total">約${yen(total)}</p>
    ${o?`<p class="note" style="margin:-6px 0 8px">${esc(o[1]+o[2])}から約${Math.round(tr.d)}km（直線）。${tr.note}</p>`:`<p class="note" style="margin:-6px 0 8px">上の欄に出発地を入れると、交通費も計算します。</p>`}
    <table>${rows}</table>
    <h4>行く施設</h4>
    ${spots.map((s,i)=>`<label class="pick"><input type="checkbox" data-spot="${i}" ${cur.checked.has(i)?"checked":""}>${esc(s[1])}</label>`).join("")}
    <h4>泊まるホテル</h4>
    ${hotels.map((x,i)=>`<label class="pick"><input type="radio" name="hotelPick" data-hotel="${i}" ${cur.hotel===i?"checked":""}>${esc(x.h[1])}</label>`).join("")}`;
  el.querySelectorAll("[data-spot]").forEach(c=>c.onchange=()=>{const i=+c.dataset.spot;c.checked?cur.checked.add(i):cur.checked.delete(i);renderCost();});
  el.querySelectorAll("[data-hotel]").forEach(c=>c.onchange=()=>{cur.hotel=+c.dataset.hotel;renderCost();});
}
// 入力欄
(function setup(){
  const opt=(id,a,b,v)=>{const s=$(id);for(let i=a;i<=b;i++)s.add(new Option(i,i));s.value=v;};
  opt("nA",1,8,2);opt("nC",0,6,1);opt("nI",0,6,1);opt("nN",1,4,1);
  $("originList").innerHTML=DATA.origins.map(o=>`<option value="${esc(o[1]+" "+o[2])}">`).join("");
  const PK="roulette-trip-settings";
  try{const s=JSON.parse(localStorage.getItem(PK)||"null");
    if(s){$("origin").value=s.origin||"";["nA","nC","nI","nN"].forEach(k=>{if(s[k]!=null)$(k).value=s[k];});mode=s.mode||"car";}}catch(e){}
  const save=()=>{try{localStorage.setItem(PK,JSON.stringify({origin:$("origin").value,nA:$("nA").value,nC:$("nC").value,nI:$("nI").value,nN:$("nN").value,mode}));}catch(e){}};
  const syncMode=()=>document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  const check=()=>{const o=findOrigin();$("originMsg").textContent=o===false?"見つかりませんでした。候補から選ぶか「県名 市町村名」で入れてください":o?`出発地：${o[1]}${o[2]}`:"";};
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;syncMode();save();renderCost();});
  ["nA","nC","nI","nN"].forEach(k=>$(k).onchange=()=>{save();renderCost();});
  $("origin").addEventListener("input",()=>{check();save();renderCost();});
  syncMode();check();
})();

// ---- 履歴 ----
const KEY="roulette-trip-kids-history";
function loadHistory(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return [];}}
function saveHistory(pref,city){const h=loadHistory();h.unshift({pref,city,at:Date.now()});
  try{localStorage.setItem(KEY,JSON.stringify(h.slice(0,30)));}catch(e){} renderHistory(h.slice(0,30));}
function renderHistory(h=loadHistory()){
  $("count").textContent=h.length?`${h.length}か所`:"";
  $("hist").innerHTML=h.length?h.map(x=>{const d=new Date(x.at);return `<li><span>${esc(x.pref)}</span><span>${d.getMonth()+1}/${d.getDate()}</span></li>`;}).join("")
    :`<li class="empty">まだありません。ルーレットを回してみてください。</li>`;
}
$("clear").onclick=()=>{try{localStorage.removeItem(KEY);}catch(e){} renderHistory([]);};
spinBtn.onclick=run; $("hub").onclick=run; $("hub").style.cursor="pointer";
renderHistory();
</script>
